seeds: [42]
multitask: false
model_type: minirocket
fs: 256

data:
  datasets:
    tuab: finetune
    # ... 
  load_batch_size: 256
  feature_batch_size: 1024
  memory_limit_gib: 32.0  # IMPORTANT - avoid OOM errors on large datasets, use lower value for resource-constrained environment.
  # null uses <local output_root>/scratch/feature_extractors.
  scratch_dir: null
  num_workers: 2

model:
  extractor:
    # Set source_path in a user-owned .local.yaml file.
    source_path: /path/to/minirocket/source/codes
    num_features: 10000
    max_dilations_per_kernel: 32
    # Numba threads used by upstream trial-parallel transform.
    n_jobs: 8
  classifier:
    # Use `alphas` for a literal grid, or this logspace form, never both.
    logspace:
      start: -3
      stop: 3
      num: 10
    selection_metric: balanced_accuracy

logging:
  experiment_name: minirocket
  run_dir: assets/run
  use_cloud: false
  outputs:
    - csv
