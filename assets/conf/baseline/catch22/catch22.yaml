# Catch-22 features + Ridge regression

seeds: [42]
multitask: false
model_type: catch22

data:
  datasets:
    tuab: finetune
    # ...
  load_batch_size: 256
  num_workers: 1

model:
  extractor:
    # CPU processes for independent trial-level feature extraction.
    n_jobs: 8
  classifier:
    # Grid-search for Ridge regression classifier.
    alphas:
      - 0.001
      - 0.01
      - 0.1
      - 1.0
      - 10.0
      - 100.0
      - 1000.0
    selection_metric: balanced_accuracy

logging:
  experiment_name: catch22
  run_dir: assets/run
  use_cloud: false
  outputs:
    - csv
