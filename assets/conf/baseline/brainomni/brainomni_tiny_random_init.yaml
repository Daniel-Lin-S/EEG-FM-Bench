# Fine-tune randomly initialized BrainOmni with the tiny architecture.

# Basic configuration
seeds: [42]
master_port: 51902
multitask: false
model_type: brainomni
fs: 256

# Data configuration
data:
  batch_size: 128
  num_workers: 1

# Model configuration
model:
  # Null invokes random initialization using the architecture below.
  pretrained_path: null

  normalize_input: true
  normalize_position: true

  freeze_tokenizer: false

  # Match the BrainOmni tiny architecture.
  window_length: 512
  n_filters: 32
  ratios: [8, 4, 2]
  kernel_size: 5
  last_kernel_size: 5
  n_dim: 256
  n_head: 4
  n_neuro: 16
  dropout: 0.0
  codebook_dim: 256
  codebook_size: 512
  num_quantizers: 4
  rotation_trick: true
  quantize_optimize_method: ema
  overlap_ratio: 0.25
  lm_dim: 256
  lm_head: 8
  lm_depth: 12
  lm_dropout: 0.1
  mask_ratio: 0.5
  num_quantizers_used: 4

  # Classifier head configuration
  classifier_head:
    # Options: avg_pool, attention_pool, dual_stream_fusion, flatten_mlp,
    # flatten_linear

    hidden_dims: [128]
    head_type: avg_pool
    dropout: 0.3

# Training configuration
training:
  max_epochs: 30
  weight_decay: 0.01
  max_grad_norm: 1.0

  # learning rate-related parameters (important in parameter searching)
  lr_schedule: cosine
  max_lr: 5e-4
  min_lr: 5e-5
  encoder_lr_scale: 0.5
  # learning rate warm-up
  warmup_epochs: 3
  warmup_scale: 1e-1

  freeze_encoder: false

  early_stopping:
    enabled: true
    metric: loss
    direction: minimize
    patience: 5
    min_delta: 0.0

  adaptive_batching:
    enabled: true
    memory_reserve_fraction: 0.15
    contention_wait_seconds: 300

  # LoRA configuration
  lora:
    use_lora: false
    lora_r: 8
    lora_alpha: 16
    lora_dropout: 0.0
    lora_target_modules: [default]
    lora_exclude_modules: null
    # Options: default, full, attention, ffn
    lora_target_type: default
    # Options: transformer, full
    lora_scope: transformer
    lora_lr_scale: 1.0

# Logging configuration
logging:
  level: info
  experiment_name: brainomni-random-base160_ft-full

  ckpt_interval: 31
  run_dir: assets/run
  save_checkpoints: false

  # Local traces: choose any of csv, log, and tensorboard.
  outputs: [csv]

  # cloud logging
  use_cloud: false
  offline: false

  tags:
    - brainomni
    - tiny
    - avg_pool
    - full

# Hyperparameter optimization uses its own seed and validation objective.
hpo:
  enabled: true
  seed: 0
  n_trials: 30
  max_consecutive_failed_trials: 5

  objective:
    metric: loss
    direction: minimize
    # Options: macro_mean, log_train_size_weighted
    multitask_reduction: macro_mean

  sampler:
    type: tpe
    seed: 0
    n_startup_trials: 5

  pruner:
    type: median
    n_startup_trials: 5
    n_warmup_epochs: 3
    interval_epochs: 1

  search_space:
    training.max_lr:
      distribution: float
      low: 2.0e-4
      high: 1.0e-3
      log: true

    training.min_lr:
      distribution: float
      low: 1.0e-6
      high: 1.0e-4
      log: true

    training.encoder_lr_scale:
      distribution: float
      low: 0.5
      high: 1.0
      log: false

    model.classifier_head.hidden_dims:
      distribution: categorical
      choices:
        - [32]
        - [64]
        - [128]
        - [256]
