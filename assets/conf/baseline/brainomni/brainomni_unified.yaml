# parameters for the pre-trained versions of BrainOmni
# (a multitask foundation model for EEG and MEG)

# Basic configuration
seeds: [42]
master_port: 51901
multitask: false   # set to true to fine-tune with training samples from all datasets.
model_type: brainomni
fs: 256

# Data configuration
data:
  batch_size: 64
  num_workers: 1
  datasets:
    tuab: finetune
    seed: finetune_sub_dependent
    hmc: finetune
    # ...

# Model configuration
model:
  # Directory containing model_cfg.json and BrainOmni.pt
  pretrained_path: /path/to/brainomni/checkpoint

  normalize_input: true
  normalize_position: true

  freeze_tokenizer: false

  # add architecture-related parameters as well if the
  # architecture is different from the public pre-trained version of BrainOmni

  # Classifier head configuration
  classifier_head:
    head_type: avg_pool # options: avg_pool, attention_pool, dual_stream_fusion, flatten_mlp, flatten_linear

    hidden_dims: [128]
    dropout: 0.3

# Training configuration
training:
  max_epochs: 30
  weight_decay: 0.01
  max_grad_norm: 1.0

  # learning rate-related parameters (important in parameter searching)
  lr_schedule: cosine
  max_lr: 5e-4
  min_lr: 5e-5
  encoder_lr_scale: 0.5
  # learning rate warm-up
  warmup_epochs: 3
  warmup_scale: 1e-1

  freeze_encoder: false

  early_stopping:
    enabled: true
    metric: loss
    direction: minimize
    patience: 5
    min_delta: 0.0

  adaptive_batching:
    enabled: true
    memory_reserve_fraction: 0.15
    contention_wait_seconds: 300

  # LoRA configuration
  lora:
    use_lora: false
    lora_r: 8
    lora_alpha: 16
    lora_dropout: 0.0
    lora_target_modules: [default]
    lora_exclude_modules: null
    # Options: default, full, attention, ffn
    lora_target_type: default
    # Options: transformer, full
    lora_scope: transformer
    lora_lr_scale: 1.0

# Logging configuration
logging:
  experiment_name: brainomni-base

  ckpt_interval: 10

  # local logging
  run_dir: assets/run

  # cloud logging
  use_cloud: true
  cloud_backend: wandb
  offline: false

  tags:
    - brainomni
    - uni
    - avg_pool
    - full

# Hyperparameter optimization uses its own seed and validation objective.
hpo:
  enabled: true
  seed: 0
  n_trials: 50
  max_consecutive_failed_trials: 5

  objective:
    metric: loss
    direction: minimize
    # Options: macro_mean, log_train_size_weighted
    multitask_reduction: macro_mean

  sampler:
    type: tpe
    seed: 0
    n_startup_trials: 10

  pruner:
    type: median
    n_startup_trials: 5
    n_warmup_epochs: 3
    interval_epochs: 1

  search_space:
    training.max_lr:
      distribution: float
      low: 2.0e-4
      high: 1.0e-3
      log: true

    training.min_lr:
      distribution: float
      low: 1.0e-6
      high: 1.0e-4
      log: true

    training.encoder_lr_scale:
      distribution: float
      low: 0.05
      high: 1.0
      log: false

    model.classifier_head.hidden_dims:
      distribution: categorical
      choices:
        - [64]
        - [128]
        - [256]
        - [256, 128]
