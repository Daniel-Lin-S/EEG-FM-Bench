# Cross-artifact test-result comparison template.
#
# Copy this public template to a local YAML file, replace every placeholder
# path with an absolute path, then run:
#   python result_vis.py <comparison.local.yaml>
#
# Labels describe any comparison condition. They do not need to be model names.

artifacts:
  - label: condition_a
    root: /replace/with/absolute/artifact_root_a
  - label: condition_b
    root: /replace/with/absolute/artifact_root_b

# Optional: map a wide paper XLSX table into comparison rows. The column names,
# sheet, and task-dependent metrics are configured here rather than hard-coded.
# The reported standard deviations are retained for plots and tables, but these
# rows are excluded from Mann-Whitney U and Cliff's-delta calculations because
# per-seed values are unavailable.
spreadsheet_sources:
  - name: paper_full_fine_tuning
    path: /replace/with/absolute/paper_results.xlsx
    sheet: 0
    header_row: 1
    # A blank worksheet header is addressed by its Excel column letter, e.g. A.
    dataset_column: Dataset
    metric_column: Metric
    dataset_map:
      Source dataset: dataset_a
    metric_map:
      Balanced accuracy:
        binary: balanced_acc
        multiclass: balanced_acc
      F1/AUROC:
        binary: auroc
        multiclass: f1
    # Use 0.01 when values are reported as percentages.
    value_scale: 1.0

# Add one artifact for every desired model column in the spreadsheet source.
# e.g., label: Paper model (full fine-tuning)
#       spreadsheet:
#         source: paper_full_fine_tuning
#         model_column: Paper model

# Select only test metrics to compare. epoch is intentionally forbidden.
# Add loss only when it should be compared with direction: minimize.
metrics:
  - name: acc
    direction: maximize
    display_name: Accuracy
  - name: balanced_acc
    direction: maximize
    display_name: Balanced accuracy
  - name: auroc
    direction: maximize
    display_name: AUROC
  - name: auc_pr
    direction: maximize
    display_name: AUPRC
  - name: cohen_kappa
    direction: maximize
    display_name: Cohen's kappa
  - name: f1
    direction: maximize
    display_name: Weighted F1

# Each dataset declares its classification task and optional display label.
datasets:
  - name: dataset_a
    task: binary
    display_name: Dataset A
  - name: dataset_b
    task: multiclass
    display_name: Dataset B

# Metrics are selected separately for binary and multiclass datasets.
task_metrics:
  binary: [balanced_acc, auroc, auc_pr]
  multiclass: [balanced_acc, cohen_kappa, f1]

plot:
  # Set false to show only mean plus standard-deviation error bars.
  show_individual_points: true
  # Optional artifact label drawn as a dotted horizontal reference line.
  naive_artifact: null

# This directory is owned by result_vis.py. It must not be inside an artifact.
output_dir: /replace/with/absolute/comparison_output_root

statistics:
  # Lower-ranked table cells receive † when q is at least this threshold.
  near_best_q_threshold: 0.05
